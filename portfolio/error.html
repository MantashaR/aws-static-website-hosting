<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Mantasha</title>
<style>
  :root { --bg: #0b1120; --text: #e2e8f0; --muted: #94a3b8; --accent: #22d3ee; }
  @media (prefers-color-scheme: light) { :root { --bg: #f8fafc; --text: #0f172a; --muted: #526079; --accent: #0891b2; } }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace; text-align: center;
  }
  h1 { font-size: 4rem; margin: 0; color: var(--accent); }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>$ cat page.html<br>cat: page.html: No such file or directory</p>
    <p><a href="/">← cd ~ (back to the portfolio)</a></p>
  </main>
</body>
</html>
